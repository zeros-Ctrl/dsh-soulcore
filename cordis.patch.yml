# dsh-soulcore —— DSH bundle patch：DSH 启动时把本插件插进 profile 的配置树。
#
# 安装（任选其一）：
#   dsh plugin --profile desktop add github:zeros-Ctrl/dsh-soulcore
#   dsh plugin --profile desktop add "link:C:\\Users\\<你>\\.dsh\\plugins\\dsh-soulcore"   # 本地开发
#
# ⚠️ name 必须与包名完全一致（dsh-soulcore）。
# 装完重启 DSH，设置页在「设置 → 人格与记忆」。
- insert:
    - id: dsh-soulcore
      name: dsh-soulcore
